name: Publish web playtest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing idle-loot-quest-web.zip
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and verify the Web export
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern idle-loot-quest-web.zip --dir "$RUNNER_TEMP" -- "$RELEASE_TAG"
          unzip -q "$RUNNER_TEMP/idle-loot-quest-web.zip" -d site
          test -s site/index.html
          packs=(site/*.pck)
          runtimes=(site/*.wasm)
          test -s "${packs[0]}"
          test -s "${runtimes[0]}"
          test -s "${runtimes[0]%.wasm}.js"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5
